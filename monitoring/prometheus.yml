global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: diabetes-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Optional: also scrape your cloud deployment (uncomment and edit the host)
  # - job_name: diabetes-api-cloud
  #   scheme: https
  #   static_configs:
  #     - targets: ["your-app.onrender.com"]
