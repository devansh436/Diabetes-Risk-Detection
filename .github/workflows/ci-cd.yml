name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, train & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Train model (quality gate)
        run: python -m src.train
        env:
          GIT_SHA: ${{ github.sha }}
          MODEL_VERSION: ci-${{ github.run_number }}
      - name: Unit + integration tests
        run: pytest --cov=src --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload trained model + coverage
        uses: actions/upload-artifact@v4
        with:
          name: model-and-coverage
          path: |
            models/
            coverage.xml

  docker:
    name: Build image & smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: diabetes-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            MODEL_VERSION=ci-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 diabetes-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Pregnancies":2,"Glucose":120,"BloodPressure":70,"SkinThickness":20,"Insulin":80,"BMI":28.5,"DiabetesPedigreeFunction":0.4,"Age":35}'
          curl -sf http://localhost:8000/metrics | grep predictions_total
          docker logs api
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            MODEL_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
          cache-from: type=gha

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy"; exit 0; fi
          curl -sf -X POST "$HOOK"
          echo "Deploy triggered"
          if [ -n "$APP_URL" ]; then
            echo "Waiting for new version at $APP_URL/health ..."
            sleep 60
            for i in $(seq 1 30); do
              curl -sf "$APP_URL/health" && exit 0
              sleep 10
            done
            echo "Deployed app did not become healthy"; exit 1
          fi
